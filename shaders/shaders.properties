# FANGLE shader options
# Conservative defaults for Iris + MobileGlues, optionally using ANGLE.
sliders=FANGLE_CONTRAST FANGLE_SATURATION FANGLE_WARMTH FANGLE_WATER_TINT FANGLE_WAVE_STRENGTH FANGLE_SHADOW_STRENGTH shadowMapResolution shadowDistance

# Shadow map and its distance are configured by constants in gbuffers_terrain.fsh.
# Shadow filtering uses four depth samples per terrain fragment.
